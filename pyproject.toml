[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-hr-agentic-rag"
version = "1.0.0"
description = "Agentic HR Policy & Operations RAG + MCP Assistant for Northstar Cloud Labs, Inc."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "google-genai>=2.0.0",
    "mcp>=1.2.0",
    "faiss-cpu>=1.9.0",
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
    "beautifulsoup4>=4.12.3",
    "pypdf>=5.0.0",
    "fpdf2>=2.8.0",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
