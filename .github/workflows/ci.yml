name: CI Test and Gated Render Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build RAG Index, Run Pytest & Eval Gate
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: hash
      MCP_TRANSPORT: stdio
      RANDOM_SEED: "42"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Hybrid RAG Index (Hash Fallback)
        run: python -m rag.ingest --provider hash

      - name: Run Integration, MCP, Health & Safety Tests
        run: pytest -v

      - name: Run 28-Case Evaluation & Ablation Regression Gate
        run: python -m evaluation.run_eval --provider mock

  deploy:
    name: Trigger Render Deploy Hook
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook if Configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy triggered cleanly."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set; skipping remote webhook trigger."
          fi
